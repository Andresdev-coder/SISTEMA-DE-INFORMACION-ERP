{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ERP PJ{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-[#233b6e] text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
            <a href="{% url 'dashboard' %}" class="text-2xl font-bold rounded-lg px-2 py-1 transition-all hover:bg-white/10">
                <img src="{% static 'img/logo.png' %}" alt="ERP PJ" class="h-8 w-8">
                <span>ERP PJ</span>
            </a>

            <div class="relative w-full md:w-1/2">
                <input placeholder="Search" type="text" id="transaction-input" class="w-full bg-white/20 text-white rounded-full py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-white/50 placeholder-gray-300">
            </div>

            <div class="flex items-center space-x-6">
                <div id="nav-links-desktop" class="hidden md:flex space-x-6">
                    <a href="{% url 'dashboard' %}" class="inline-flex items-center gap-2 rounded-lg px-3 py-2 font-medium transition-all hover:bg-white/10" aria-label="Volver al dashboard">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layout-dashboard"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                        <span>Dashboard</span>
                    </a>
                </div>

                <div class="relative">
                    <button id="user-menu-button" aria-haspopup="true" aria-expanded="false" aria-controls="user-menu-dropdown" class="flex items-center space-x-2 text-lg font-medium transition-all hover:bg-white/10 p-2 rounded-lg">
                        <span>{{ user.first_name|default:user.username }}</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    <div id="user-menu-dropdown" class="user-dropdown-menu hidden absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded-md shadow-lg py-1 z-50">
                        <a href="{% url 'profile' %}" class="flex items-center px-4 py-2 hover:bg-gray-200">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-user-round h-5 w-5 shrink-0"><path d="M17.925 20.056a6 6 0 0 0-11.851.001"/><circle cx="12" cy="11" r="4"/><circle cx="12" cy="12" r="10"/></svg>
                            <span class="ml-2">Mi perfil</span>
                        </a>
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="flex w-full items-center px-4 py-2 text-left hover:bg-gray-200">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-log-out h-5 w-5 shrink-0"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
                            <span class="ml-2">Cerrar sesión</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="hamburger-menu space-y-2 md:hidden cursor-pointer" id="hamburger-btn">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-[#233b6e] pb-4 px-4 text-center transition-all duration-300 ease-in-out">
            <div id="nav-links-mobile" class="flex flex-col">
                <a href="{% url 'dashboard' %}" class="block py-2 text-lg font-medium transition-all hover:text-gray-300">Dashboard</a>
                <a href="{% url 'profile' %}" class="block py-2 text-lg font-medium transition-all hover:text-gray-300">Mi perfil</a>
            </div>
            <div class="border-t border-gray-600 mt-4 pt-4">
                <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit" class="block w-full py-2 text-lg font-medium transition-all hover:text-gray-300">Cerrar sesión</button></form>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-8">
        {% block content %}

        {% endblock content %}
    </main>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
